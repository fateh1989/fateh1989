name: YM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ym-v0.21-tiktok-lite-target
    paths:
      - 'ym-ci/android/**'
      - 'ym-ci/relay/**'
      - '.github/workflows/ym-build.yml'

env:
  YM_VERSION: "0.21.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate YM relay JavaScript
        run: node --check ym-ci/relay/src/index.js

      - name: Verify stable version metadata
        run: |
          grep 'versionCode = 21' ym-ci/android/app/build.gradle.kts
          grep 'versionName = "0.21.0"' ym-ci/android/app/build.gradle.kts

      - name: Unit tests
        run: gradle -p ym-ci/android testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p ym-ci/android assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YM-v0.21.0-tiktok-lite-target-apk
          path: ym-ci/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish permanent v0.21.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.21.0 >/dev/null 2>&1; then
            echo 'v0.21.0 release already exists; leaving frozen baseline unchanged.'
          else
            gh release create v0.21.0 \
              'ym-ci/android/app/build/outputs/apk/debug/app-debug.apk#YM-v0.21.0.apk' \
              --target "$GITHUB_SHA" \
              --title 'YM v0.21.0 — Stable Baseline' \
              --notes 'Stable baseline for YM. Supports official TikTok packages including TikTok Lite (com.tiktok.lite.go). Android versionCode 21, versionName 0.21.0. Future updates should be developed from this baseline without replacing it.'
          fi
