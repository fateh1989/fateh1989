name: YM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ym-v0.10-official
    paths:
      - 'ym-ci/android/**'
      - '.github/workflows/ym-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p ym-ci/android testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p ym-ci/android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YM-v0.12-safe-apk
          path: ym-ci/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
