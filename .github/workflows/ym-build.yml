name: YM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ym-v0.23-continuous-auto
    paths:
      - 'ym-ci/android/**'
      - 'ym-ci/relay/**'
      - '.github/workflows/ym-build.yml'

env:
  YM_VERSION: "0.23.0-dev"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply YM v0.23 source patch
        run: python3 ym-ci/android/tools/patch_v023_v2.py

      - name: Validate YM relay JavaScript
        run: node --check ym-ci/relay/src/index.js

      - name: Verify development version metadata
        run: |
          grep 'versionCode = 23' ym-ci/android/app/build.gradle.kts
          grep 'versionName = "0.23.0-dev"' ym-ci/android/app/build.gradle.kts

      - name: Unit tests
        run: gradle -p ym-ci/android testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p ym-ci/android assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YM-v0.23-dev-apk
          path: ym-ci/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
