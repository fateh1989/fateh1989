name: YM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ym-v0.29-wheel-runtime
    paths:
      - 'ym-ci/android/**'
      - 'ym-ci/relay/**'
      - '.github/workflows/ym-build.yml'

concurrency:
  group: ym-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate YM relay JavaScript
        run: node --check ym-ci/relay/src/index.js

      - name: Unit tests
        run: gradle -p ym-ci/android testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p ym-ci/android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YM-v0.29.2-wheel-runtime-apk
          path: ym-ci/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
